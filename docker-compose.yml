name: gestion-depense

x-app-service: &app-service
  image: gestion-depense-app:local
  env_file:
    - .env.docker
  volumes:
    - app-storage:/var/www/storage
    - app-backups:/var/www/backups
  networks:
    - backend
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  migrate:
    <<: *app-service
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  queue:
    <<: *app-service
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--queue=mail,default", "--sleep=2", "--tries=3", "--timeout=60", "--max-time=3600"]
    stop_grace_period: 90s
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app-service
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: gestion-depense-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["tools"]
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

networks:
  frontend:
  backend:

volumes:
  db-data:
  app-storage:
  app-backups:
