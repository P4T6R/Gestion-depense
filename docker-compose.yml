version: '3.8'

services:
  # Application Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suivi-depense-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app-data:/var/www
    networks:
      - suivi-depense
    depends_on:
      - db

  # Serveur Nginx
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: suivi-depense-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app-data:/var/www:ro
    networks:
      - suivi-depense
    depends_on:
      - app

  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: suivi-depense-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootArts2026Secure!
      MYSQL_DATABASE: suivi_depense
      MYSQL_USER: suivi_user
      MYSQL_PASSWORD: Arts2026Secure!
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - suivi-depense
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin (optionnel - pour gérer la base de données)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: suivi-depense-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: suivi_user
      PMA_PASSWORD: Arts2026Secure!
    ports:
      - "8080:80"
    networks:
      - suivi-depense
    depends_on:
      - db

networks:
  suivi-depense:
    driver: bridge

volumes:
  dbdata:
    driver: local
  app-data:
    driver: local
