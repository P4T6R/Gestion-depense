services:
  # Application Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: suivi-depense-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Définir l’URL publique HTTPS}
      SESSION_SECURE_COOKIE: "true"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APP_KEY: ${APP_KEY:?Définir une clé Laravel stable}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-suivi_depense}
      DB_USERNAME: ${MYSQL_USER:-suivi_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Définir le mot de passe MySQL}
    volumes:
      - app-storage:/var/www/storage
    networks:
      - suivi-depense
    depends_on:
      db:
        condition: service_healthy

  # Serveur Nginx
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: suivi-depense-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    networks:
      - suivi-depense
    depends_on:
      - app

  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: suivi-depense-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définir le mot de passe root MySQL}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-suivi_depense}
      MYSQL_USER: ${MYSQL_USER:-suivi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définir le mot de passe MySQL}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - suivi-depense
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin (optionnel - pour gérer la base de données)
  phpmyadmin:
    image: phpmyadmin:latest
    profiles: ["tools"]
    container_name: suivi-depense-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - suivi-depense
    depends_on:
      - db

networks:
  suivi-depense:
    driver: bridge

volumes:
  dbdata:
    driver: local
  app-storage:
    driver: local
