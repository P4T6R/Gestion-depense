name: Docker

on:
  push:
    branches: [main, feat/notifications-cloche]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          cp .env.docker.example .env.docker
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=|' .env.docker
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=ci_database_password|' .env.docker
          sed -i 's|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=ci_database_password|' .env.docker
          sed -i 's|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=ci_root_password|' .env.docker

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build backend and frontend images
        run: docker compose build app web

      - name: Start complete stack
        run: docker compose up -d

      - name: Smoke test web, queue and scheduler
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/login >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/login >/dev/null
          docker compose exec -T app php artisan migrate:status
          docker compose exec -T app php artisan queue:failed
          docker compose exec -T app php artisan schedule:list
          test "$(docker compose ps --status running --services | grep -Ec '^(app|db|queue|scheduler|web)$')" -eq 5

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Clean ephemeral CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
